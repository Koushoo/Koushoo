<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges"><style>.trace{stroke-dasharray:40;animation:trace 3s linear infinite}.sheet{animation:sheet 4s steps(3,end) infinite}@keyframes trace{0%{stroke-dashoffset:40}70%,100%{stroke-dashoffset:0}}@keyframes sheet{0%,100%{transform:translate(0,0)}50%{transform:translate(-2px,-2px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="5" y="4" width="15" height="20" fill="#8c8bbd" /><g class="sheet"><rect x="11" y="9" width="15" height="20" fill="#8bb1a4" /><rect x="14" y="14" width="9" height="2" fill="#dbe4dc" /><rect x="14" y="19" width="7" height="2" fill="#dbe4dc" /></g></svg>
