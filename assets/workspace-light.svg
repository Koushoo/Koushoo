<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Koushoo — a little workspace</title>
<desc id="desc">Koushoo's little workspace. A pixel cat hops off the desk, explores the floor and jumps back. Outside the window, day turns to night. Student. Building small things, learning as I go.</desc>
<defs><clipPath id="view"><rect x="10" y="6" width="76" height="29"/></clipPath>
<clipPath id="scene"><rect width="112" height="82" rx="3"/></clipPath></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.cloud{animation:drift 16s ease-in-out infinite alternate}
.cursor{animation:blink 1.3s steps(1,end) infinite}
.eye{animation:cat-blink 7s steps(1,end) infinite}
.tail{transform-origin:58px 44px;animation:tail 7s steps(3,end) infinite}
.steam{animation:steam 3s ease-in-out infinite}
.night{animation:night 48s ease-in-out infinite;opacity:0}
.sun{animation:sunset 48s ease-in-out infinite}
.moon{animation:moonrise 48s ease-in-out infinite;opacity:0}
.stars{animation:starlight 48s ease-in-out infinite;opacity:0}
.shooting-star{animation:shoot 48s linear infinite;opacity:0}
.cat-motion{animation:explore 24s cubic-bezier(.4,0,.2,1) infinite}
.cat-facing{transform-box:fill-box;transform-origin:center;animation:face 24s steps(1,end) infinite}
.paws{animation:pad 0.6s steps(2,end) infinite}
.line-a,.line-b{transform-box:fill-box;transform-origin:left;animation:code 7s steps(8,end) infinite}
.line-b{animation-delay:1.1s}
@keyframes drift{to{transform:translateX(7px)}}
@keyframes blink{50%{opacity:0}}
@keyframes cat-blink{0%,44%,49%,100%{opacity:1}45%,48%{opacity:0}}
@keyframes tail{0%,65%,100%{transform:rotate(0deg)}75%,85%{transform:rotate(12deg)}}
@keyframes steam{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(-2px);opacity:.65}}
@keyframes night{0%,15%,100%{opacity:0}42%,76%{opacity:.95}}
@keyframes sunset{0%,10%,100%{transform:translateY(0);opacity:1}35%,78%{transform:translateY(27px);opacity:0}}
@keyframes moonrise{0%,29%,93%,100%{opacity:0;transform:translateY(10px)}43%,75%{opacity:1;transform:translateY(0)}}
@keyframes starlight{0%,30%,95%,100%{opacity:0}45%,75%{opacity:.85}}
@keyframes shoot{0%,59%,64%,100%{opacity:0;transform:translate(0,0)}60%{opacity:1;transform:translate(0,0)}63%{opacity:0;transform:translate(-30px,12px)}}
@keyframes explore{0%,10%,76%,100%{transform:translate(0,0)}14%{transform:translate(8px,-10px)}20%{transform:translate(31px,0)}25%{transform:translate(31px,22px)}34%{transform:translate(-8px,22px)}40%,47%{transform:translate(-25px,22px)}57%,63%{transform:translate(31px,22px)}69%{transform:translate(17px,-10px)}}
@keyframes face{0%,25%,48%,100%{transform:scaleX(1)}26%,47%{transform:scaleX(-1)}}
@keyframes pad{0%,100%{transform:translateY(0)}50%{transform:translateY(1px)}}
@keyframes code{0%,10%{transform:scaleX(.1)}55%,90%{transform:scaleX(1)}100%{transform:scaleX(.1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="998" height="428" rx="19" fill="#f8f8fb" stroke="#dddde7"/>
<path d="M1 51H999" stroke="#dddde7"/>
<circle cx="29" cy="27" r="5.5" fill="#ff6058"/><circle cx="48" cy="27" r="5.5" fill="#febc2e"/><circle cx="67" cy="27" r="5.5" fill="#29c840"/>
<text x="500" y="32" font-size="13" text-anchor="middle" fill="#737787">Koushoo’s desk</text>
<text x="53" y="127" font-size="13" letter-spacing="2" fill="#7274b8">HELLO THERE</text>
<text x="50" y="188" font-size="45" font-weight="600" letter-spacing="-1.8" fill="#252734">I’m Koushoo.</text>
<text x="53" y="228" font-size="19" fill="#737787">A student, building small things.</text>
<rect x="53" y="263" width="28" height="3" rx="1.5" fill="#7274b8"/>
<text x="53" y="304" font-size="13" fill="#737787">learning as I go.</text>
<text x="53" y="375" font-size="16" font-style="italic" fill="#7274b8">the cat has other plans.</text>
<g transform="translate(495 76) scale(4)" shape-rendering="crispEdges" clip-path="url(#scene)"><rect x="0" y="0" width="112" height="82" fill="#eeedf5" /><rect x="0" y="51" width="112" height="31" fill="#d7d5e5" /><rect x="8" y="4" width="80" height="33" fill="#c9c4d5" /><rect x="10" y="6" width="76" height="29" fill="#deddf2" /><g clip-path="url(#view)"><rect x="10" y="6" width="76" height="29" fill="#171c38" class="night"/><g class="sun"><rect x="69" y="9" width="8" height="8" fill="#e5bfaa" /></g><g class="moon"><rect x="26" y="10" width="5" height="6" fill="#e2debf" /><rect x="28" y="9" width="3" height="1" fill="#e2debf" /><rect x="29" y="10" width="3" height="4" fill="#171c38" /></g><g class="stars"><rect x="17" y="9" width="1" height="1" fill="#eee6d5" /><rect x="39" y="13" width="1" height="1" fill="#eee6d5" /><rect x="58" y="9" width="1" height="1" fill="#eee6d5" /><rect x="77" y="17" width="1" height="1" fill="#eee6d5" /><rect x="66" y="15" width="1" height="1" fill="#eee6d5" /></g><g class="shooting-star"><rect x="72" y="10" width="2" height="1" fill="#f3e4c7" /><rect x="74" y="9" width="3" height="1" fill="#afa9b8" /></g><g class="cloud"><rect x="15" y="11" width="15" height="3" fill="#f8f4fa" /><rect x="18" y="9" width="8" height="2" fill="#f8f4fa" /><rect x="51" y="19" width="18" height="3" fill="#f8f4fa" /><rect x="55" y="17" width="9" height="2" fill="#f8f4fa" /></g><path d="M10 35V29H18V26H24V23H32V26H39V29H47V27H53V24H60V27H67V30H77V28H86V35Z" fill="#b5b3d8"/><path d="M10 35V32H23V30H35V32H48V31H61V33H74V31H86V35Z" fill="#8d9cb6"/></g><rect x="47" y="6" width="2" height="29" fill="#c9c4d5" /><rect x="10" y="21" width="76" height="2" fill="#c9c4d5" /><rect x="6" y="37" width="84" height="2" fill="#c9c4d5" /><rect x="5" y="48" width="87" height="3" fill="#c9c4d5" /><rect x="3" y="46" width="90" height="3" fill="#b69b8e" /><rect x="9" y="49" width="3" height="11" fill="#b69b8e" /><rect x="84" y="49" width="3" height="11" fill="#b69b8e" /><rect x="15" y="27" width="28" height="17" fill="#50586c" /><rect x="17" y="29" width="24" height="12" fill="#273748" /><rect x="27" y="44" width="4" height="2" fill="#747888" /><rect x="23" y="45" width="12" height="1" fill="#747888" /><rect x="20" y="32" width="8" height="1" fill="#abc6c0" class="line-a"/><rect x="20" y="35" width="14" height="1" fill="#c4b7de" class="line-b"/><rect x="20" y="38" width="6" height="1" fill="#e3c5ad" /><rect x="28" y="38" width="2" height="1" fill="#e3c5ad" class="cursor"/><rect x="17" y="45" width="22" height="1" fill="#a5a6b7" /><rect x="44" y="41" width="5" height="5" fill="#d8b9ab" /><rect x="49" y="42" width="2" height="3" fill="#d8b9ab" /><rect x="49" y="43" width="1" height="1" fill="#eeedf5" /><g class="steam" opacity=".5"><rect x="45" y="35" width="1" height="3" fill="#737787" /><rect x="47" y="33" width="1" height="3" fill="#737787" /></g><g class="cat-motion"><g class="cat-facing"><rect x="59" y="40" width="14" height="6" fill="#bd9e91" /><rect x="57" y="41" width="2" height="4" fill="#bd9e91" /><rect x="62" y="38" width="8" height="2" fill="#bd9e91" /><rect x="68" y="37" width="7" height="8" fill="#d7b6a2" /><rect x="68" y="35" width="2" height="3" fill="#d7b6a2" /><rect x="73" y="35" width="2" height="3" fill="#d7b6a2" /><rect x="69" y="36" width="1" height="2" fill="#bd9e91" /><rect x="73" y="36" width="1" height="2" fill="#bd9e91" /><rect x="70" y="43" width="3" height="2" fill="#ead2bd" /><rect x="69" y="40" width="1" height="1" fill="#4c4350" class="eye"/><rect x="73" y="40" width="1" height="1" fill="#4c4350" class="eye"/><rect x="71" y="42" width="1" height="1" fill="#94787b" /><g class="tail"><rect x="55" y="39" width="3" height="6" fill="#bd9e91" /><rect x="53" y="37" width="4" height="3" fill="#bd9e91" /><rect x="53" y="35" width="2" height="3" fill="#bd9e91" /></g><g class="paws"><rect x="60" y="44" width="3" height="2" fill="#ead2bd" /><rect x="69" y="44" width="3" height="2" fill="#ead2bd" /></g></g></g><rect x="80" y="40" width="8" height="6" fill="#b9abc4" /><rect x="79" y="39" width="10" height="2" fill="#c8bbd1" /><rect x="83" y="31" width="2" height="9" fill="#709987" /><rect x="79" y="33" width="4" height="3" fill="#709987" /><rect x="77" y="30" width="3" height="4" fill="#709987" /><rect x="85" y="34" width="4" height="3" fill="#709987" /><rect x="88" y="31" width="3" height="4" fill="#709987" /><rect x="83" y="28" width="2" height="3" fill="#709987" /><rect x="4" y="43" width="9" height="3" fill="#9298b6" /><rect x="5" y="40" width="7" height="3" fill="#c7afbc" /><rect x="94" y="8" width="15" height="18" fill="#d9c6a6" /><rect x="106" y="8" width="3" height="3" fill="#eeedf5" /><g fill="#6e625f" font-family="Georgia,serif" font-size="2.6" font-style="italic"><text x="96" y="13">one thing</text><text x="96" y="17">at a time.</text><path d="M96 20q4-2 9 0" stroke="#9d8c7b" stroke-width=".4" fill="none"/></g><rect x="9" y="74" width="7" height="3" fill="#a7a0b8" /><rect x="18" y="73" width="7" height="3" fill="#a7a0b8" /><rect x="99" y="75" width="10" height="2" fill="#989eb5" /><rect x="101" y="72" width="7" height="3" fill="#c1b1bf" /></g>
</svg>
